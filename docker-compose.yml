version: '3.9'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamequest
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  web:
    build: .
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gamequest
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
      EMAIL_SERVER_HOST: mailhog
      EMAIL_SERVER_PORT: 1025
      EMAIL_FROM: noreply@gamequest.local
      STRIPE_SECRET_KEY: sk_test
      STRIPE_WEBHOOK_SECRET: whsec_test
    depends_on:
      - db
  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
volumes:
  postgres-data:
